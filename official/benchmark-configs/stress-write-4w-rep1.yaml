monitors:
  resource:
  - module: prometheus
    options:
      url: "http://prometheus:9090"
      metrics:
        include: [pharma, caliper]
        queries:
        - name: CPU% (avg)
          query: 'sum(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name) * 100'
          step: 5
          label: name
          statistic: avg
        - name: CPU% (max)
          query: 'sum(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name) * 100'
          step: 5
          label: name
          statistic: max
        - name: Memory(MB) (avg)
          query: 'sum(container_memory_working_set_bytes{name=~".+"}) by (name)'
          step: 5
          label: name
          statistic: avg
          multiplier: 0.000001
        - name: Memory(MB) (max)
          query: 'sum(container_memory_working_set_bytes{name=~".+"}) by (name)'
          step: 5
          label: name
          statistic: max
          multiplier: 0.000001
