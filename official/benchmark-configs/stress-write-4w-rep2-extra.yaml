        tag: wr80

  - label: addDrug_tps120
    description: addDrug at 120 tps (60 s)
    txDuration: 60
    rateControl:
      type: fixed-rate
      opts:
        tps: 120
    workload:
      module: benchmarks/scenario/simple/kareem/addDrug.js
      arguments:
        tag: wr120

  - label: addDrug_tps160
    description: addDrug at 160 tps (60 s)
    txDuration: 60
    rateControl:
      type: fixed-rate
      opts:
        tps: 160
    workload:
      module: benchmarks/scenario/simple/kareem/addDrug.js
