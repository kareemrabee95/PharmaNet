      Writers:
        Type: Signature
        Rule: "OR('distributorMSP.admin', 'distributorMSP.peer', 'distributorMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('distributorMSP.admin', 'distributorMSP.peer', 'distributorMSP.client')"
      Endorsement:
        Type: Signature
        Rule: "OR('distributorMSP.peer')"
    AnchorPeers:
      - Host: peer0.distributor.pharma-network.com
