#Capabilities

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

#Application

Application: &ApplicationDefaults
  Organizations:
  Policies: &ApplicationDefaultPolicies
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities: *ApplicationCapabilities

#Orderer
Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer1.pharma-network.com:7050
    - orderer2.pharma-network.com:7050
    - orderer3.pharma-network.com:7050
  EtcdRaft:
    Consenters:
      - Host: orderer1.pharma-network.com
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/pharma-network.com/orderers/orderer1.pharma-network.com/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/pharma-network.com/orderers/orderer1.pharma-network.com/tls/server.crt
      - Host: orderer2.pharma-network.com
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/pharma-network.com/orderers/orderer2.pharma-network.com/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/pharma-network.com/orderers/orderer2.pharma-network.com/tls/server.crt
      - Host: orderer3.pharma-network.com
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/pharma-network.com/orderers/orderer3.pharma-network.com/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/pharma-network.com/orderers/orderer3.pharma-network.com/tls/server.crt
    Options:
      TickInterval: 500ms
      ElectionTick: 10
      HeartbeatTick: 1
      MaxInflightBlocks: 5
      SnapshotIntervalSize: 16777216
  BatchTimeout: 500ms
  BatchSize:
    MaxMessageCount: 100
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 2 MB
  Organizations:
  Capabilities: *OrdererCapabilities
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    # BlockValidation specifies what signatures must be included in the block
    # from the orderer for the peer to validate it.
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

Channel: &ChannelDefaults
  Policies:
    # Who may invoke the 'Deliver' API
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    # Who may invoke the 'Broadcast' API
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    # By default, who may modify elements at this config level
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities


#Profiles
Profiles:
  OrdererGenesis:
    <<: *ChannelDefaults
    Capabilities:
      <<: *ChannelCapabilities
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities:
        <<: *OrdererCapabilities
    Consortiums:
      PharmacyConsortium:
        Organizations:
          - *manufacturer
          - *distributor
          - *retailer
          - *consumer
          - *transporter
          - *eda

  PharmaChannel:
    <<: *ChannelDefaults
    Consortium: PharmacyConsortium
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *manufacturer
        - *distributor
        - *retailer
        - *consumer
        - *transporter
        - *eda
      Capabilities:
        <<: *ApplicationCapabilities
