  - &consumer
    Name: consumerMSP
    ID: consumerMSP
    MSPDir: crypto-config/peerOrganizations/consumer.pharma-network.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('consumerMSP.admin', 'consumerMSP.peer', 'consumerMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('consumerMSP.admin', 'consumerMSP.peer', 'consumerMSP.client')"
      Admins:
        Type: Signature
