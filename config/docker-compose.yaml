services:
  caliper_2.2:
    container_name: caliper
    image: hyperledger/caliper:0.6.0
    # Default image ENTRYPOINT is "caliper" — override so the container stays up for docker exec.
    entrypoint: ["tail", "-f", "/dev/null"]
    group_add:
      - "999"
    environment:
      - CALIPER_BIND_SUT=fabric:2.2
    volumes:
      - ./caliper-benchmarks-local:/hyperledger/caliper/workspace:Z
      - ./reports:/hyperledger/caliper/reports:Z
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - network_pharmacy

networks:
  network_pharmacy:
    external: true
