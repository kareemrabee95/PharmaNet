name: connection-distributor
version: "1.0"

client:
  organization: distributor
  connection:
    timeout:
      peer:
        endorser: 300
      orderer: 300

channels:
  pharmachannel:
    orderers:
      - orderer1.pharma-network.com
      - orderer2.pharma-network.com
      - orderer3.pharma-network.com
    peers:
      peer0.distributor.pharma-network.com:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true
      peer1.distributor.pharma-network.com:
        endorsingPeer: false
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true
      peer0.retailer.pharma-network.com:
        endorsingPeer: true
        chaincodeQuery: false
        ledgerQuery: false
        eventSource: false
      peer0.consumer.pharma-network.com:
        endorsingPeer: true
        chaincodeQuery: false
        ledgerQuery: false
        eventSource: false
      peer0.transporter.pharma-network.com:
        endorsingPeer: true
        chaincodeQuery: false
        ledgerQuery: false
        eventSource: false

organizations:
  distributor:
    mspid: distributorMSP
    peers:
      - peer0.distributor.pharma-network.com
      - peer1.distributor.pharma-network.com
    certificateAuthorities:
      - ca.distributor.pharma-network.com
  retailer:
    mspid: retailerMSP
    peers:
      - peer0.retailer.pharma-network.com
  consumer:
    mspid: consumerMSP
    peers:
      - peer0.consumer.pharma-network.com
  transporter:
    mspid: transporterMSP
    peers:
      - peer0.transporter.pharma-network.com

orderers:
  orderer1.pharma-network.com:
    url: grpcs://orderer1.pharma-network.com:7050
    tlsCACerts:
      path: networks/fabric/kareem/crypto-config/ordererOrganizations/pharma-network.com/orderers/orderer1.pharma-network.com/msp/tlscacerts/tlsca.pharma-network.com-cert.pem
    grpcOptions:
      ssl-target-name-override: orderer1.pharma-network.com
  orderer2.pharma-network.com:
    url: grpcs://orderer2.pharma-network.com:7050
    tlsCACerts:
      path: networks/fabric/kareem/crypto-config/ordererOrganizations/pharma-network.com/orderers/orderer2.pharma-network.com/msp/tlscacerts/tlsca.pharma-network.com-cert.pem
    grpcOptions:
      ssl-target-name-override: orderer2.pharma-network.com
  orderer3.pharma-network.com:
    url: grpcs://orderer3.pharma-network.com:7050
    tlsCACerts:
      path: networks/fabric/kareem/crypto-config/ordererOrganizations/pharma-network.com/orderers/orderer3.pharma-network.com/msp/tlscacerts/tlsca.pharma-network.com-cert.pem
    grpcOptions:
      ssl-target-name-override: orderer3.pharma-network.com

peers:
  peer0.distributor.pharma-network.com:
    url: grpcs://peer0.distributor.pharma-network.com:9051
    tlsCACerts:
      path: networks/fabric/kareem/crypto-config/peerOrganizations/distributor.pharma-network.com/peers/peer0.distributor.pharma-network.com/tls/ca.crt
    grpcOptions:
      ssl-target-name-override: peer0.distributor.pharma-network.com
  peer1.distributor.pharma-network.com:
    url: grpcs://peer1.distributor.pharma-network.com:10051
    tlsCACerts:
      path: networks/fabric/kareem/crypto-config/peerOrganizations/distributor.pharma-network.com/peers/peer1.distributor.pharma-network.com/tls/ca.crt
    grpcOptions:
      ssl-target-name-override: peer1.distributor.pharma-network.com
  peer0.retailer.pharma-network.com:
    url: grpcs://peer0.retailer.pharma-network.com:11051
    tlsCACerts:
      path: networks/fabric/kareem/crypto-config/peerOrganizations/retailer.pharma-network.com/peers/peer0.retailer.pharma-network.com/tls/ca.crt
    grpcOptions:
      ssl-target-name-override: peer0.retailer.pharma-network.com
  peer0.consumer.pharma-network.com:
    url: grpcs://peer0.consumer.pharma-network.com:13051
    tlsCACerts:
      path: networks/fabric/kareem/crypto-config/peerOrganizations/consumer.pharma-network.com/peers/peer0.consumer.pharma-network.com/tls/ca.crt
    grpcOptions:
      ssl-target-name-override: peer0.consumer.pharma-network.com
  peer0.transporter.pharma-network.com:
    url: grpcs://peer0.transporter.pharma-network.com:15051
    tlsCACerts:
      path: networks/fabric/kareem/crypto-config/peerOrganizations/transporter.pharma-network.com/peers/peer0.transporter.pharma-network.com/tls/ca.crt
    grpcOptions:
      ssl-target-name-override: peer0.transporter.pharma-network.com

certificateAuthorities:
  ca.distributor.pharma-network.com:
    url: http://ca.distributor.pharma-network.com:8054
    httpOptions:
      verify: false
