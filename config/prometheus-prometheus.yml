global:
  scrape_interval: 1s
  external_labels:
    monitor: 'devopsage-monitor'

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "orderer"
    static_configs:
      - targets:
          - "orderer1.pharma-network.com:9443"
          - "orderer2.pharma-network.com:9444"
          - "orderer3.pharma-network.com:9445"
  - job_name: "peer0.manufacturer"
    static_configs:
      - targets: ["peer0.manufacturer.pharma-network.com:9444"]
  - job_name: "peer1.manufacturer"
    static_configs:
      - targets: ["peer1.manufacturer.pharma-network.com:9544"]
    
  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
