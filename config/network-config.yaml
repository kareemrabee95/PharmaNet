name: Fabric
version: "2.0.0"
mutual-tls: false

caliper:
  blockchain: fabric

channels:
  - channelName: pharmachannel
    create: false
    contracts:
      - id: pharmanet
        version: "1.1"
        language: node

organizations:
  - mspid: EdaOrgMSP
    identities:
      certificates:
        - name: 'Admin@eda'
          clientPrivateKey:
            path: networks/fabric/kareem/crypto-config/peerOrganizations/eda.pharma-network.com/users/Admin@eda.pharma-network.com/msp/keystore/priv_sk
          clientSignedCert:
            path: networks/fabric/kareem/crypto-config/peerOrganizations/eda.pharma-network.com/users/Admin@eda.pharma-network.com/msp/signcerts/Admin@eda.pharma-network.com-cert.pem
    connectionProfile:
      path: networks/fabric/kareem/connection-eda.yaml
      discover: false

  - mspid: manufacturerMSP
